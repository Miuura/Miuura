<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Valentino Hartanto — software engineer</title><desc id="desc">Building native Apple experiences, on-device intelligence, and full-stack products. A luminous violet and cyan portfolio banner.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1022"/><stop offset="1" stop-color="#101027"/></linearGradient><radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".38"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="orb" cx=".3" cy=".22" r=".85"><stop stop-color="#b9f7ff"/><stop offset=".23" stop-color="#62a7ff"/><stop offset=".55" stop-color="#7758ec"/><stop offset=".82" stop-color="#30175c"/><stop offset="1" stop-color="#151329"/></radialGradient><linearGradient id="type" x2="1" y2=".3"><stop stop-color="#f4f0ff"/><stop offset=".6" stop-color="#b9b0ff"/><stop offset="1" stop-color="#7ce7ff"/></linearGradient><linearGradient id="ring"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#b794ff"/><stop offset="1" stop-color="#7449e8"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9c9bc0" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect x="1" y="1" width="1198" height="458" rx="28"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="460" fill="url(#bg)"/><ellipse cx="990" cy="155" rx="440" ry="390" fill="url(#glow)"/><rect width="1200" height="460" fill="url(#grid)"/><path d="M700 0L520 460M1100 0L920 460" stroke="#8673d9" stroke-opacity=".08"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="52" y="42" width="218" height="31" rx="15.5" fill="#191b35" stroke="#353354"/><circle cx="69" cy="57.5" r="3.5" fill="#8e89ff"/><text x="82" y="62" fill="#cac5ee" font-size="11.5" font-weight="600" letter-spacing="1.8">SOFTWARE ENGINEER</text><text x="48" y="169" fill="#f5f6ff" font-size="83" font-weight="750" letter-spacing="-4">Valentino</text><text x="48" y="254" fill="url(#type)" font-size="83" font-weight="750" letter-spacing="-4">Hartanto.</text><text x="53" y="302" fill="#c8c9df" font-size="21">Native experiences. Intelligent by design.</text><text x="53" y="336" fill="#8d92b0" font-size="17">From the first experiment to the final interaction.</text><g font-size="12" font-weight="600"><rect x="52" y="380" width="157" height="34" rx="17" fill="#151a2d" stroke="#30394b"/><text x="69" y="401" fill="#83e0f4">01 / APPLE APPS</text><rect x="220" y="380" width="167" height="34" rx="17" fill="#1a172e" stroke="#39304e"/><text x="237" y="401" fill="#c4abff">02 / ON-DEVICE ML</text><rect x="398" y="380" width="146" height="34" rx="17" fill="#151e2b" stroke="#293c47"/><text x="415" y="401" fill="#88dfba">03 / WEB</text></g><text x="872" y="55" fill="#77779a" font-size="11" letter-spacing="2.8">DESIGN × ENGINEERING</text></g><g transform="translate(947 202)"><ellipse rx="172" ry="68" transform="rotate(-28)" fill="none" stroke="url(#ring)" stroke-width="1" opacity=".28"/><circle r="113" fill="url(#orb)"/><ellipse rx="112" ry="36" transform="rotate(-28)" fill="none" stroke="#cef5ff" stroke-width=".8" opacity=".17"/><ellipse rx="112" ry="73" transform="rotate(-28)" fill="none" stroke="#cef5ff" stroke-width=".8" opacity=".14"/><ellipse rx="47" ry="112" transform="rotate(-28)" fill="none" stroke="#cef5ff" stroke-width=".8" opacity=".13"/><path d="M-149 87C-92 111 142 9 157-66" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/><circle cx="-136" cy="80" r="6" fill="#79ebff"><animate attributeName="opacity" values=".45;1;.45" dur="5s" repeatCount="indefinite"/></circle><circle cx="85" cy="-137" r="3" fill="#b7a3ff"/><circle cx="152" cy="-3" r="2" fill="#6ccddd"/></g><rect x="784" y="300" width="353" height="120" rx="18" fill="#101426" fill-opacity